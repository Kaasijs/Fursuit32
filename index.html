<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fursuit32</title>
<style>
  :root {
    --blue: #5BCEFA;
    --pink: #F5A9B8;
    --white: #FFFFFF;
    --bg: #131213;
    --panel: #1c1c1f;
    --panel-line: #2a2a2e;
    --text-dim: #8a8a90;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.607) 0%, rgba(0, 0, 0, 0.707) 30%, rgba(31, 24, 29, 0.96) 100%),
      url("background.png?v=2") center top / cover no-repeat;
    background-color: var(--bg);
    color: var(--white);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(1rem, 4vw, 3rem);
    gap: clamp(1rem, 3vw, 1.75rem);
  }

  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .title-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .title-img {
    width: clamp(150px, 42vw, 230px);
    height: auto;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
  }

  h1 {
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin: 0;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.4rem;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }

  .status-dot.connected {
    background: var(--blue);
    box-shadow: 0 0 0 0 rgba(91, 206, 250, 0.6);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(91, 206, 250, 0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(91, 206, 250, 0); }
    100% { box-shadow: 0 0 0 0 rgba(91, 206, 250, 0); }
  }

  .status-text {
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  .status-text.connected { color: var(--white); }

  button.connect-btn {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--bg);
    background: linear-gradient(90deg, var(--blue), var(--pink));
    border: none;
    border-radius: 8px;
    padding: 0.85rem 1.2rem;
    cursor: pointer;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 20px rgba(91, 206, 250, 0.25), 0 4px 20px rgba(245, 169, 184, 0.15);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  button.connect-btn:active { transform: scale(0.98); }
  button.connect-btn:disabled { opacity: 0.4; cursor: default; }
  button.connect-btn:not(:disabled):hover { opacity: 0.92; }

  .panel {
    width: 100%;
    max-width: 480px;
    background: rgba(20, 20, 23, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    padding: clamp(1.25rem, 4vw, 2rem);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(91, 206, 250, 0.06);
  }

  .sliders {
    display: flex;
    justify-content: space-between;
    gap: clamp(0.75rem, 3vw, 1.5rem);
  }

  .slider-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .slider-label {
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .slider-value {
    font-size: 1.05rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* vertical range slider, cross-browser-ish */
  .slider-track {
    position: relative;
    width: 100%;
    height: clamp(240px, 55vw, 380px);
    display: flex;
    justify-content: center;
  }

  input[type="range"].vslider {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 64px;
    height: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    touch-action: none;
  }

  input[type="range"].vslider::-webkit-slider-runnable-track {
    width: 22px;
    border-radius: 11px;
    background: var(--panel-line);
  }

  input[type="range"].vslider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--white);
    border: 4px solid var(--bg);
    margin-left: -11px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  input[type="range"].vslider::-moz-range-track {
    width: 22px;
    border-radius: 11px;
    background: var(--panel-line);
  }

  input[type="range"].vslider::-moz-range-thumb {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--white);
    border: 4px solid var(--bg);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  .pin-led input[type="range"]::-webkit-slider-runnable-track { background: linear-gradient(0deg, var(--blue) 0%, var(--pink) var(--fill, 0%), var(--panel-line) var(--fill, 0%)); }
  .pin-fan input[type="range"]::-webkit-slider-runnable-track { background: linear-gradient(0deg, var(--white) var(--fill, 0%), var(--panel-line) var(--fill, 0%)); }

  .pin-led .slider-value { color: var(--pink); }
  .pin-fan .slider-value { color: var(--white); }

  .pin-name {
    font-size: 0.68rem;
    color: var(--text-dim);
  }

  footer {
    max-width: 480px;
    width: 100%;
    color: var(--text-dim);
    font-size: 0.72rem;
    line-height: 1.5;
    text-align: center;
  }

  footer a.subtitle {
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  footer a.subtitle:hover {
    color: var(--pink);
  }

  .browser-warning {
    max-width: 480px;
    width: 100%;
    background: #2a1f1f;
    border: 1px solid #4a3030;
    border-radius: 10px;
    padding: 0.9rem 1rem;
    font-size: 0.8rem;
    color: #f0b0b0;
    line-height: 1.5;
    display: none;
  }

  .battery-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
    opacity: 0.5;
    transition: opacity 0.2s ease;
  }

  .battery-row.visible { opacity: 1; }

  .battery-icon {
    position: relative;
    width: 30px;
    height: 15px;
    border: 2px solid var(--text-dim);
    border-radius: 3px;
    display: flex;
    align-items: center;
    padding: 2px;
  }

  .battery-icon::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 4px;
    width: 3px;
    height: 5px;
    background: var(--text-dim);
    border-radius: 0 2px 2px 0;
  }

  .battery-fill {
    height: 100%;
    width: 0%;
    background: var(--blue);
    border-radius: 1px;
    transition: width 0.4s ease, background 0.4s ease;
  }

  .battery-fill.low { background: var(--pink); }

  .battery-text {
    font-size: 0.82rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

  <div class="title-wrap">
    <img src="title.png" alt="Kaasijs" class="title-img">
  </div>

  <header>
    <h1>My Fursuit32 | Kaasijs</h1>
    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Not connected</span>
    </div>
    <div class="battery-row" id="batteryRow">
      <div class="battery-icon">
        <div class="battery-fill" id="batteryFill"></div>
      </div>
      <span class="battery-text" id="batteryText">--%</span>
    </div>
  </header>

  <div class="browser-warning" id="browserWarning">
    This browser doesn't support Web Bluetooth. On iPhone, open this page inside the <strong>Bluefy</strong> app instead of Safari directly.
  </div>

  <button class="connect-btn" id="connectBtn">Connect to fursuit</button>

  <div class="panel">
    <div class="sliders">
      <div class="slider-col pin-led">
        <div class="slider-value" id="valLed">0</div>
        <div class="slider-track">
          <input type="range" class="vslider" id="sliderLed" min="0" max="255" value="0" disabled>
        </div>
        <div class="slider-label">LEDS</div>
        <div class="pin-name">GPIO 25 + 26</div>
      </div>

      <div class="slider-col pin-fan">
        <div class="slider-value" id="valFan">0</div>
        <div class="slider-track">
          <input type="range" class="vslider" id="sliderFan" min="0" max="255" value="0" disabled>
        </div>
        <div class="slider-label">Fan</div>
        <div class="pin-name">GPIO 27 + 22</div>
      </div>
    </div>
  </div>

  <footer>
    <a class="subtitle" href="https://github.com/Kaasijs">A thingy made by Kaasijs UWU</a>
  </footer>

<script>
  const SERVICE_UUID = '12345678-1234-1234-1234-123456789abc';
  const CHAR_UUIDS = [
    '12345678-1234-1234-1234-123456789ab1',
    '12345678-1234-1234-1234-123456789ab2',
    '12345678-1234-1234-1234-123456789ab3',
    '12345678-1234-1234-1234-123456789ab4',
  ];
  const BATTERY_CHAR_UUID = '12345678-1234-1234-1234-123456789ab5';
  const DEVICE_NAME = 'Fursuit Kaasijs';

  const connectBtn = document.getElementById('connectBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const browserWarning = document.getElementById('browserWarning');

  const sliderLed = document.getElementById('sliderLed');
  const sliderFan = document.getElementById('sliderFan');
  const valLed = document.getElementById('valLed');
  const valFan = document.getElementById('valFan');

  // sliders[] pairs each UI slider with the characteristic UUID(s) it
  // should write to. LED drives two physical pins (chars 1 and 2) at
  // once; Fan drives just the third. lastSent/writing track state for
  // the periodic sync loop below (see SYNC_INTERVAL_MS).
  const sliders = [
    { input: sliderLed, valueEl: valLed, charUuids: [CHAR_UUIDS[0], CHAR_UUIDS[1]], lastSent: null, writing: false },
    { input: sliderFan, valueEl: valFan, charUuids: [CHAR_UUIDS[2], CHAR_UUIDS[3]], lastSent: null, writing: false },
  ];

  // Resolved BLECharacteristic objects, keyed by UUID, filled in on connect.
  let characteristicsByUuid = {};
  let batteryCharacteristic = null;
  let bleDevice = null;

  const batteryRow = document.getElementById('batteryRow');
  const batteryFill = document.getElementById('batteryFill');
  const batteryText = document.getElementById('batteryText');

  if (!navigator.bluetooth) {
    browserWarning.style.display = 'block';
    connectBtn.disabled = true;
    connectBtn.textContent = 'Web Bluetooth unavailable';
  }

  function setConnected(isConnected) {
    statusDot.classList.toggle('connected', isConnected);
    statusText.classList.toggle('connected', isConnected);
    statusText.textContent = isConnected ? 'Connected' : 'Not connected';
    connectBtn.textContent = isConnected ? 'Disconnect' : 'Connect to device';
    sliders.forEach(s => {
      s.input.disabled = !isConnected;
      if (isConnected) s.lastSent = null;  // force a push of current position
    });
  }

  function updateFill(slider) {
    const pct = (slider.value / slider.max) * 100;
    slider.style.setProperty('--fill', pct + '%');
  }

  sliders.forEach(s => updateFill(s.input));

  async function connect() {
    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }],
        optionalServices: [SERVICE_UUID],
      });

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      characteristicsByUuid = {};
      for (const uuid of CHAR_UUIDS) {
        characteristicsByUuid[uuid] = await service.getCharacteristic(uuid);
      }
      batteryCharacteristic = await service.getCharacteristic(BATTERY_CHAR_UUID);

      setConnected(true);

      // Don't wait for the first poll interval — show battery right away.
      try {
        const value = await batteryCharacteristic.readValue();
        const percent = value.getUint8(0);
        batteryRow.classList.add('visible');
        batteryText.textContent = `${percent}%`;
        batteryFill.style.width = `${percent}%`;
        batteryFill.classList.toggle('low', percent <= 20);
      } catch (err) {
        console.error('Initial battery read failed:', err);
      }
    } catch (err) {
      console.error('Connection failed:', err);
      statusText.textContent = 'Connection failed — tap to retry';
    }
  }

  function onDisconnected() {
    setConnected(false);
    characteristicsByUuid = {};
    batteryCharacteristic = null;
    batteryRow.classList.remove('visible');
    batteryText.textContent = '--%';
  }

  connectBtn.addEventListener('click', async () => {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      setConnected(false);
    } else {
      await connect();
    }
  });

  // 'input' just updates the on-screen number/fill instantly, for a
  // responsive feel — it does NOT write over BLE. Actual writes happen
  // below in the periodic sync loop.
  sliders.forEach(({ input, valueEl }) => {
    input.addEventListener('input', () => {
      valueEl.textContent = input.value;
      updateFill(input);
    });
  });

  // Periodic sync: every SYNC_INTERVAL_MS, check each slider's current
  // position and write it only if it changed since the last successful
  // write, and only if that slider isn't already mid-write. This is
  // deliberately decoupled from the 'input' event, which can fire far
  // faster than BLE writes can complete — writing on every event caused
  // overlapping writes that silently failed, which was why a fast flick
  // to 0 often didn't register.
  const SYNC_INTERVAL_MS = 100;

  setInterval(() => {
    sliders.forEach(async (s) => {
      if (s.input.disabled || s.writing) return;

      const current = parseInt(s.input.value, 10);
      if (current === s.lastSent) return;

      s.writing = true;
      const duty = new Uint8Array([current]);

      for (const uuid of s.charUuids) {
        const characteristic = characteristicsByUuid[uuid];
        if (!characteristic) continue;
        try {
          await characteristic.writeValue(duty);
        } catch (err) {
          console.error(`Write failed on ${uuid}:`, err);
        }
      }

      s.lastSent = current;
      s.writing = false;
    });
  }, SYNC_INTERVAL_MS);

  // Battery polling: reads the read-only battery characteristic every
  // few seconds and updates the icon + percentage in the header.
  const BATTERY_POLL_INTERVAL_MS = 8000;

  setInterval(async () => {
    if (!batteryCharacteristic) return;
    try {
      const value = await batteryCharacteristic.readValue();
      const percent = value.getUint8(0);

      batteryRow.classList.add('visible');
      batteryText.textContent = `${percent}%`;
      batteryFill.style.width = `${percent}%`;
      batteryFill.classList.toggle('low', percent <= 20);
    } catch (err) {
      console.error('Battery read failed:', err);
    }
  }, BATTERY_POLL_INTERVAL_MS);
</script>

</body>
</html>
